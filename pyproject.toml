[project]
name = "un-votes-intelligence-platform"
version = "0.1.0"
description = "Research-grade UN Votes Analyzer and geopolitical intelligence system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=25.0.1",
    "pandera>=0.32.1",
    "scikit-learn>=1.9.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
